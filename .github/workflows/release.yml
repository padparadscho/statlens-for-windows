name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate and extract version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Tag '$env:TAG_NAME' is not a stable semantic version. Use vMAJOR.MINOR.PATCH."
          }

          $version = $env:TAG_NAME.Substring(1)
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Statlens.slnx

      - name: Run tests
        run: dotnet test Statlens.slnx -c Release --no-restore

      - name: Publish app
        run: dotnet publish src/Statlens/Statlens.csproj -c Release -r win-x64 --self-contained --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Build installer
        env:
          PRODUCT_VERSION: ${{ steps.version.outputs.version }}
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Statlens.iss'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Statlens ${{ steps.version.outputs.version }}
          files: installer/bin/StatlensSetup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
